name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - colombia.json
      - data_github.json
      - data_timeline_github.json
      - data_metadata_github.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare public files
        run: |
          mkdir _site
          cp index.html _site/
          cp colombia.json _site/
          cp data_github.json _site/
          cp data_timeline_github.json _site/
          cp data_metadata_github.json _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
